name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-zip:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Package the tagged extension
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          if [[ "$RELEASE_TAG" != "v$version" || "$version" != "$(node -p 'require("./package.json").version')" ]]; then
            echo "The release tag and extension/package versions must agree." >&2
            exit 1
          fi
          zip="$RUNNER_TEMP/translate-with-ai-$RELEASE_TAG.zip"
          git archive --format=zip --output="$zip" HEAD -- \
            manifest.json index.html callback.html waiting.html src _locales icons LICENSE
          unzip -q "$zip" -d "$RUNNER_TEMP/translate-with-ai"
      - name: Test the release package
        env:
          EXTENSION_SOURCE: ${{ runner.temp }}/translate-with-ai
        run: |
          npm ci
          npm run check
          npm test
          npm exec -- playwright install --with-deps chromium
          npm run test:browser
      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/translate-with-ai-$RELEASE_TAG.zip" --clobber
